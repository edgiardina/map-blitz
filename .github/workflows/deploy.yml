name: Build & Deploy to Verve

# Deploys the static Vite build to mapblitz.edgiardina.com on Verve over FTPS
# on every push to main. Also runnable manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # FTP action requires server-dir to end with "/". Normalize the secret.
      - name: Normalize server dir
        id: dir
        run: echo "path=${DIR%/}/" >> "$GITHUB_OUTPUT"
        env:
          DIR: ${{ secrets.FTP_SERVER_DIR }}

      - name: Deploy dist/ to Verve over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ steps.dir.outputs.path }}
          dangerous-clean-slate: false
